<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#1a202c">
    <meta name="author" content="Duy Nguyen">
    <meta name="robots" content="noindex, follow">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="The K's">
    <meta property="og:locale" content="vi_VN">
    <meta property="og:url" content="https://kuinguyen.com/404.html">
    <meta property="og:title" content="404 — The K's">
    <meta property="og:description" content="Trang bạn tìm không tồn tại trên kuinguyen.com.">
    <meta property="og:image" content="https://i.postimg.cc/zfR3bqtk/logo-rbg-removebg-preview.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="404 — The K's">
    <meta name="twitter:description" content="Trang bạn tìm không tồn tại trên kuinguyen.com.">
    <meta name="twitter:image" content="https://i.postimg.cc/zfR3bqtk/logo-rbg-removebg-preview.png">
    <title>404 — The K's</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background-color: #1a202c; }
        .hero-bg {
            background-color: #1a202c;
            background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.1) 1px, transparent 0);
            background-size: 20px 20px;
        }
        #header { transition: top 0.3s ease-in-out; }
        .hacker-font { font-family: 'VT323', monospace; color: #f87171; }
        .logo-dark-theme { filter: invert(1); }
        .typing-cursor {
            display: inline-block; width: 1ch; background-color: #f87171;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { from, to { background-color: transparent } 50% { background-color: #f87171; } }
    </style>
</head>
<body class="bg-[#1a202c] text-gray-300">

    <!-- Header -->
    <header id="header" class="bg-[#1a202c]/80 backdrop-blur-lg fixed top-0 left-0 right-0 z-50 shadow-md shadow-black/20">
        <div class="container mx-auto px-6 py-2">
            <div class="flex items-center justify-between">
                <a href="index.html">
                    <img src="https://i.postimg.cc/zfR3bqtk/logo-rbg-removebg-preview.png" alt="The K's Logo" class="h-20 w-auto logo-dark-theme">
                </a>
                <nav class="hidden md:flex items-center space-x-8">
                    <a href="english.html" class="text-gray-300 hover:text-white transition duration-300">English</a>
                    <a href="techlish.html" class="text-gray-300 hover:text-white transition duration-300">Techlish</a>
                    <a href="mmo.html" class="text-gray-300 hover:text-white transition duration-300">MMO</a>
                    <a href="deal.html" class="text-gray-300 hover:text-white transition duration-300">Deals</a>
                    <a href="about.html" class="text-gray-300 hover:text-white transition duration-300">About</a>
                </nav>
                <button id="mobile-menu-button" class="md:hidden" aria-label="Menu" aria-expanded="false">
                    <svg class="w-6 h-6 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                </button>
            </div>
        </div>
        <div id="mobile-menu" class="hidden md:hidden bg-gray-900/95 backdrop-blur-lg">
            <a href="english.html" class="block py-3 px-6 text-sm text-gray-300 hover:bg-gray-800">English</a>
            <a href="techlish.html" class="block py-3 px-6 text-sm text-gray-300 hover:bg-gray-800">Techlish</a>
            <a href="mmo.html" class="block py-3 px-6 text-sm text-gray-300 hover:bg-gray-800">MMO</a>
            <a href="deal.html" class="block py-3 px-6 text-sm text-gray-300 hover:bg-gray-800">Deals</a>
            <a href="about.html" class="block py-3 px-6 text-sm text-gray-300 hover:bg-gray-800">About</a>
        </div>
    </header>

    <main>
        <section class="hero-bg text-white min-h-screen flex items-center justify-center pt-24 pb-16">
            <div class="container mx-auto px-6 text-center">
                <p class="hacker-font text-7xl md:text-9xl leading-none mb-2">404</p>
                <h1 class="hacker-font text-3xl md:text-5xl leading-snug mb-6">
                    Page not found<span class="typing-cursor"></span>
                </h1>
                <p class="text-lg text-gray-400 max-w-xl mx-auto mb-10">
                    Trang bạn tìm không tồn tại hoặc đã được dời đi. Thử một trong các lối sau nhé.
                </p>
                <div class="flex flex-wrap items-center justify-center gap-3">
                    <a href="index.html" class="px-5 py-2.5 rounded-lg border border-gray-600 text-gray-300 hover:text-white hover:border-gray-400 transition">Trang chủ</a>
                    <a href="about.html" class="px-5 py-2.5 rounded-lg border border-gray-600 text-gray-300 hover:text-white hover:border-gray-400 transition">About</a>
                    <a href="mmo.html" class="px-5 py-2.5 rounded-lg border border-gray-600 text-gray-300 hover:text-white hover:border-gray-400 transition">MMO</a>
                    <a href="deal.html" class="px-5 py-2.5 rounded-lg border border-gray-600 text-gray-300 hover:text-white hover:border-gray-400 transition">Deals</a>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-400 py-6">
        <div class="container mx-auto px-6 text-center">
            <p>&copy; 2026 The K's. All Rights Reserved.</p>
        </div>
    </footer>

    <script>
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');
        mobileMenuButton.addEventListener('click', () => {
            const open = mobileMenu.classList.toggle('hidden');
            mobileMenuButton.setAttribute('aria-expanded', String(!open));
        });

        let lastScrollTop = 0;
        const header = document.getElementById('header');
        window.addEventListener('scroll', function() {
            let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            header.style.top = (scrollTop > lastScrollTop && scrollTop > header.offsetHeight) ? '-100px' : '0';
            lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
        }, false);
    </script>

</body>
</html>
